[project]
name = "gtr-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "William Thorne", email = "wthorne1@sheffield.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "dateparser>=1.3.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "huggingface-hub>=1.4.1",
    "ipykernel>=7.2.0",
    "kaleido>=1.2.0",
    "litellm>=1.81.10",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "pandas-stubs~=3.0.0",
    "playwright>=1.58.0",
    "plotly>=6.6.0",
    "polars>=1.39.0",
    "psycopg>=3.3.2",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.3",
    "scipy-stubs~=1.17.0",
    "sentence-transformers>=5.2.2",
    "sqlalchemy>=2.0.46",
    "tenacity>=9.1.4",
]

[project.scripts]
gtr-database = "gtr_database:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
